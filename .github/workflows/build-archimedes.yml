name: Archimedes kernel builds

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Kernel variant to build (auto follows the selected branch)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - pure
          - kernelsu
  push:
    branches: [main, kernelsu]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Pushes follow their branch. Manual runs default to the selected branch,
      # while an explicit input can override it.
      BUILD_VARIANT: ${{ (github.event_name == 'workflow_dispatch' && inputs.variant != 'auto' && inputs.variant) || (github.ref_name == 'kernelsu' && 'kernelsu') || 'pure' }}
      JOBS: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show build selection
        run: echo "Building $BUILD_VARIANT from $GITHUB_REF_NAME"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev \
            device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 cpio

      - name: Build pure kernel
        if: ${{ env.BUILD_VARIANT == 'pure' }}
        env:
          OUT: ${{ runner.temp }}/archimedes-pure
        run: |
          ./build_archimedes.sh pure
          test "$(grep -c '^CONFIG_KSU=y' "$OUT/.config")" -eq 0

      - name: Build KernelSU kernel
        if: ${{ env.BUILD_VARIANT == 'kernelsu' }}
        env:
          OUT: ${{ runner.temp }}/archimedes-ksu
        run: |
          ./build_archimedes.sh ksu
          grep -q '^CONFIG_KSU=y' "$OUT/.config"

      - name: Package pure boot image
        if: ${{ env.BUILD_VARIANT == 'pure' }}
        env:
          OUT: ${{ runner.temp }}/archimedes-pure
        run: |
          test -f package_archimedes_boot.py
          python3 -m py_compile package_archimedes_boot.py
          python3 package_archimedes_boot.py \
            --template tools/archimedes-boot-template-32MiB.img \
            --kernel "$OUT/arch/arm64/boot/Image.gz-dtb" \
            --output boot-archimedes-pure-32MiB.img
          sha256sum boot-archimedes-pure-32MiB.img

      - name: Package KernelSU boot image
        if: ${{ env.BUILD_VARIANT == 'kernelsu' }}
        env:
          OUT: ${{ runner.temp }}/archimedes-ksu
        run: |
          test -f package_archimedes_boot.py
          python3 -m py_compile package_archimedes_boot.py
          python3 package_archimedes_boot.py \
            --template tools/archimedes-boot-template-32MiB.img \
            --kernel "$OUT/arch/arm64/boot/Image.gz-dtb" \
            --output boot-archimedes-kernelsu-32MiB.img
          sha256sum boot-archimedes-kernelsu-32MiB.img

      - name: Upload pure artifacts
        if: ${{ env.BUILD_VARIANT == 'pure' }}
        uses: actions/upload-artifact@v4
        with:
          name: archimedes-pure-${{ github.sha }}
          if-no-files-found: error
          path: |
            boot-archimedes-pure-32MiB.img
            ${{ runner.temp }}/archimedes-pure/BUILD-INFO.txt

      - name: Upload KernelSU artifacts
        if: ${{ env.BUILD_VARIANT == 'kernelsu' }}
        uses: actions/upload-artifact@v4
        with:
          name: archimedes-kernelsu-${{ github.sha }}
          if-no-files-found: error
          path: |
            boot-archimedes-kernelsu-32MiB.img
            ${{ runner.temp }}/archimedes-ksu/BUILD-INFO.txt
